[package]
name = "feedrico-mcp"
version = "0.2.0"
description = "A read-only MCP server (stdio) that lets Claude Code or Vibe read a Feedrico Library."
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "feedrico_mcp"

[[bin]]
name = "feedrico-mcp"
path = "src/main.rs"

[dependencies]
feedrico-core = { path = "../feedrico-core" }
serde_json = "1.0.154"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
rusqlite = { version = "0.41.1", features = ["bundled"] }
tempfile = "3.27.0"
