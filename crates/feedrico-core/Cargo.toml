[package]
name = "feedrico-core"
version = "0.1.0"
description = "Feedrico domain logic: the portable Library, Feeds, Articles. No UI or Tauri dependency."
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ammonia = "4.2.4"
blake3 = "1.8.7"
feed-rs = "3.0.0"
futures = "0.3.34"
gethostname = "1.1.0"
lol_html = "3.0.3"
quick-xml = "0.42.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "charset", "system-proxy", "gzip", "brotli", "deflate", "zstd"] }
rusqlite = { version = "0.41.1", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "time"] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
