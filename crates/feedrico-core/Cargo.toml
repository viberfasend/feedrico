[package]
name = "feedrico-core"
version = "0.1.0"
description = "Feedrico domain logic: the portable Library, Feeds, Articles. No UI or Tauri dependency."
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gethostname = "1.1.0"
rusqlite = { version = "0.41.1", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
