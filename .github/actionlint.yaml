# actionlint config (picked up automatically by rhysd/actionlint and the actionlint job in
# review.yml). The Blacksmith runners are self-hosted, so their labels are not in
# actionlint's built-in list; without this the lint would fail on ci.yml, perf.yml and
# release.yml, which predate the lint.
self-hosted-runner:
  labels:
    - blacksmith-4vcpu-ubuntu-2404
    - blacksmith-4vcpu-ubuntu-2204
