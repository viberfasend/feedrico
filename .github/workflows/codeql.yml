name: CodeQL

# Security analysis for JavaScript/TypeScript and Rust. Pull requests + manual dispatch
# only — never a schedule and never a push to main: GitHub merges by rebase, so a push to
# main is the PR that just passed, and re-running here would double the work (the same
# rule that keeps ci.yml off main pushes). GitHub-hosted ubuntu-latest: CodeQL is free for
# public repositories, so this must not add minutes to the billed Blacksmith runners.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Upload of results needs security-events: write, which GITHUB_TOKEN has for same-repo
  # PRs. Fork PRs run read-only and skip the upload.
  security-events: write

jobs:
  analyze:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The Rust autobuild compiles the whole workspace, including the Tauri shell, whose
      # build embeds the built UI and needs the Linux webview libraries (same setup as
      # the Linux job in ci.yml).
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      - uses: Swatinem/rust-cache@v2
      - run: npm run build
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript, rust
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
