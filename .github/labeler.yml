# Labels applied by the labeler job in .github/workflows/review.yml.
# Uses the repository's existing labels only, one area per top-level path, kept small on
# purpose. actions/labeler v6 requires the changed-files object form.
area:ui:
  - changed-files:
      - any-glob-to-any-file: 'src/**'
area:design-system:
  - changed-files:
      - any-glob-to-any-file: 'tokens/**'
      - any-glob-to-any-file: 'brand/**'
area:library:
  - changed-files:
      - any-glob-to-any-file: 'crates/**'
area:infra:
  - changed-files:
      - any-glob-to-any-file: 'src-tauri/**'
      - any-glob-to-any-file: '.github/**'
      - any-glob-to-any-file: 'scripts/**'
      - any-glob-to-any-file: 'package.json'
      - any-glob-to-any-file: 'package-lock.json'
      - any-glob-to-any-file: 'Cargo.toml'
      - any-glob-to-any-file: 'Cargo.lock'
      - any-glob-to-any-file: 'vite.config.ts'
area:content:
  - changed-files:
      - any-glob-to-any-file: 'site/**'
documentation:
  - changed-files:
      - any-glob-to-any-file: 'docs/**'
      - any-glob-to-any-file: '*.md'
